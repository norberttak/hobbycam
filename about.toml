# cargo-about: third-party licence report; `generate` fails on any licence not listed here.
# GPL-3.0 is deliberately absent: a GPL dependency must fail the build (keeps the App Store path open, RELEASING.md).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# our own publish = false crates (GPL-3.0-or-later) are not third party
private = { ignore = true }
